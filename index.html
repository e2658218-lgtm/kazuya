
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>みんなですごろく</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🎲 みんなですごろく 🎲</h1>
 <p>創価大学キャンパスライフすごろく・最大4人プレイ</p>

  <div class="game">
    <div class="game-left">
      <div id="board">
  <img
    id="board-image"
    src="board1.jpg"
    alt="1限のすごろく盤面"
  >
        <div id="piece1" class="piece">🔴</div>
        <div id="piece2" class="piece">🔵</div>
        <div id="piece3" class="piece">🟡</div>
        <div id="piece4" class="piece">🟢</div>
      </div>

      <div class="game-controls">
        <p id="turn">プレイヤー1の番です</p>
        <button id="roll">🎲 サイコロを振る</button>
        <button id="next" disabled>次に進む ➡️</button>
        <p id="result">ボタンを押してゲーム開始！</p>
        <p id="positions">
  🔴 プレイヤー1：スタート<br>
  🔵 プレイヤー2：スタート<br>
  🟡 プレイヤー3：スタート<br>
  🟢 プレイヤー4：スタート
        </p>
      </div>
    </div>

    <div class="dify-assistant">
      <h2>🤖 すごろくAIアシスタント</h2>
      <p>ゲームの状況を確認したり、AIに質問したりできます。</p>

      <input
        id="dify-question"
        type="text"
        placeholder="例：今のゲーム状況を教えて"
      >

      <button id="ask-dify">AIに質問する</button>

      <p id="dify-answer">質問を入力してください。</p>

      <a
        href="https://udify.app/chat/UbMwquOdTtNOIg2Y"
        target="_blank"
        rel="noopener noreferrer">
        Difyアシスタントを別画面で開く
      </a>
    </div>
  </div>

  <script src="script.js?v=7"></script>
</body>
</html>
